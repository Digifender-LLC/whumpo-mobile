name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Assemble, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"
      - name: Install Android build SDK
        run: bash android/scripts/ci-install-sdk.sh build
      - name: Assemble, lint and run unit and host tests
        working-directory: android
        run: ./gradlew assembleLocalDebug assembleDeployedDebug assembleLocalDebugAndroidTest assembleDeployedDebugAndroidTest lintLocalDebug lintDeployedDebug :shared:jvmTest :shared:compileKotlinJvm :shared:testAndroidHostTest testLocalDebugUnitTest testDeployedDebugUnitTest
      - name: Upload synthetic build and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-reports
          path: |
            android/androidApp/build/reports/**
            android/androidApp/build/test-results/**
            android/shared/build/reports/**
            android/shared/build/test-results/**
            android/shared/build/outputs/roborazzi/**
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"
      - name: Install Android emulator SDK
        run: bash android/scripts/ci-install-sdk.sh emulator
      - name: Grant this ephemeral runner KVM access
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Run client instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
            ${{ matrix.api-level == 36 && '-memory 2560' || '' }}
          working-directory: android
          script: bash scripts/ci-instrumented.sh ${{ matrix.api-level }}
      - name: Upload synthetic instrumentation reports and allowlisted diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-api-${{ matrix.api-level }}
          path: |
            android/androidApp/build/reports/androidTests/**
            android/androidApp/build/outputs/androidTest-results/**
            android/androidApp/build/outputs/instrumented-diagnostics/anr-before.json
            android/androidApp/build/outputs/instrumented-diagnostics/anr-after.json
            android/androidApp/build/outputs/instrumented-diagnostics/device-state.txt
            android/androidApp/build/outputs/instrumented-diagnostics/tree-failures.txt
            android/androidApp/build/outputs/instrumented-diagnostics/test-exit-code.txt
          if-no-files-found: ignore
          retention-days: 7
