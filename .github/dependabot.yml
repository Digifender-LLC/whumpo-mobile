version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 2
    groups:
      gradle-updates:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 2
    groups:
      github-actions-updates:
        patterns:
          - "*"
